name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: kambi/castle-engine-cloud-builds-tools:cge-unstable

    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4

      - name: Build and Configure CGE from Fork
        run: |
          ./tools/build-tool/castle-engine_compile.sh
          ln -sf $(pwd)/tools/build-tool/castle-engine /usr/local/bin/castle-engine
          echo "CASTLE_ENGINE_PATH=$(pwd)" >> $GITHUB_ENV

      - name: Package Portable Editor to Android APK
        run: |
          cd tools/castle-editor-portable
          castle-engine package --target=android --mode=debug
          echo "=== MGA NABUONG ANDROID FILES: ==="
          find castle-engine-output -name "*.apk" -o -name "*.aab" || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: castle-editor-portable-android
          path: |
            tools/castle-editor-portable/castle-engine-output/**/*.apk
            tools/castle-editor-portable/castle-engine-output/**/*.aab
          if-no-files-found: warn
